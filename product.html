<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting to the product - PX98</title>
<!-- Every product has its own page now: product-<id>.html, written out by
     tools/build-seo.js. This file is what is left of the old ?id= route, kept so
     that a bookmark, a shared link or an already-crawled URL still lands on the
     right product instead of a 404.

     On Vercel it is rarely reached at all: vercel.json turns /product.html?id=x
     into a 308 to /product-x.html, which is the redirect Google wants to see and
     which passes the link equity on. The script below is the fallback for
     everywhere else - GitHub Pages, a plain static server, the filesystem - where
     no redirect rule exists.

     noindex, follow: nothing here is worth a result of its own, but the crawler
     should still walk through to the product page it points at. -->
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.px98lubricants.com/products.html">
<link rel="stylesheet" href="assets/css/px98.css">
<script>
(function () {
  var id = new URLSearchParams(window.location.search).get('id');
  var to = id && /^[a-z0-9-]+$/.test(id) ? 'product-' + id + '.html' : 'products.html';
  window.location.replace(to);
})();
</script>
</head>
<body data-page="products">
<main>
  <section class="sect">
    <div class="wrap">
      <p class="mono" style="padding:120px 0">
        Taking you to the product.
        <a href="products.html" style="color:var(--y)">View the full range</a> if nothing happens.
      </p>
    </div>
  </section>
</main>
</body>
</html>
